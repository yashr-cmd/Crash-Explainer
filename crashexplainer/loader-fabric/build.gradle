plugins {
    id 'java'
}

group = 'com.yash.crashexplainer'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    implementation project(':core')

    // Fabric Loader's entrypoint API - stable across essentially every Fabric-supported
    // MC version, which is why one shim covers "almost all versions" on this loader too.
    // Bump this freely to whatever's newest - the entrypoint API we use hasn't changed
    // in years, so newer Loader versions compile against this fine.
    compileOnly 'net.fabricmc:fabric-loader:0.16.14'
}


jar {
    // Same packaging rule as Forge: ship the shared core inside the loader JAR.
    dependsOn project(':core').tasks.named('classes')
    from(project(':core').sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
